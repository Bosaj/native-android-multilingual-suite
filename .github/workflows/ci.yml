name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Repository Governance & Structure
        run: |
          echo "Validating repository governance files..."
          test -f README.md && echo "README.md OK"
          test -f LICENSE && echo "LICENSE OK"
          test -f CONTRIBUTING.md && echo "CONTRIBUTING.md OK"
          test -f SECURITY.md && echo "SECURITY.md OK"
          test -f CODE_OF_CONDUCT.md && echo "CODE_OF_CONDUCT.md OK"
          test -f docs/wiki/Home.md && echo "docs/wiki/Home.md OK"

  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'app/build/outputs/apk/debug/app-debug.apk'

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
